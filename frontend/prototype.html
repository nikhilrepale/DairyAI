-content:space-between;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;font-size:13px}.alert .count{font-weight:800}.alert.amber{background:#fffbf1;border-color:#f0e2bf}.alert.red{background:#fff7f5;border-color:#f1d8d3}.table-scroll{overflow:auto;overscroll-behavior-x:contain}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th{text-align:left;padding:10px;color:#75827a;font-size:11px;font-weight:650;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #eef1ed}tbody tr:last-child td{border-bottom:0}tbody tr.clickable{cursor:pointer}tbody tr.clickable:hover{background:#f8fbf8}.status{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:30px;background:#eaf4ec;color:#247348;font-size:11px;font-weight:700}.status.review{background:var(--amber);color:#926517}.status.invalid{background:var(--red);color:#a64238}.status.dot:before{content:"";width:6px;height:6px;background:currentColor;border-radius:50%}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0 14px}.filters input,.filters select,.field input,.field select{border:1px solid #dfe6df;border-radius:9px;background:white;color:#172820;min-height:40px;padding:8px 10px;font-size:13px}.filters input{min-width:170px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:7px 10px;border-radius:30px;background:#f1f5f1;color:#58675d;border:1px solid transparent;font-size:12px}.chip.active{background:#e2f1e6;color:#21643e;border-color:#cbe1d0}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:650;color:#68766d}.formrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.bar{height:8px;border-radius:10px;background:#edf1ed;overflow:hidden}.bar span{display:block;height:100%;background:#48a36c;border-radius:10px}.empty{padding:27px;text-align:center;color:var(--muted);font-size:13px}.segment{display:flex;gap:5px;background:#f0f4f0;border-radius:11px;padding:4px;width:max-content;max-width:100%;overflow:auto;margin:8px 0 14px}.segment button{border:0;border-radius:8px;background:transparent;padding:8px 13px;color:#657369;white-space:nowrap;font-size:12px}.segment button.active{background:#fff;color:#245d3c;box-shadow:0 2px 8px #1b382514;font-weight:750}.matrix{min-width:520px}.matrix td,.matrix th{text-align:center}.matrix th:first-child{text-align:left}.ratecell{width:74px;padding:7px;border:1px solid #e1e9e1;border-radius:7px;text-align:center;color:#21432f}.summaryline{display:flex;gap:18px;flex-wrap:wrap;color:#627167;font-size:12px}.summaryline b{color:#1d3225}.profile{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #edf1ed}.profile:last-child{border:0}.avatar{height:42px;width:42px;border-radius:50%;background:#e8f2e9;display:grid;place-items:center;color:#327148;font-weight:800}.profile small{display:block;color:var(--muted);margin-top:3px}.terms{display:flex;gap:7px;flex-wrap:wrap}.term{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:9px;font-size:12px;color:#55645a}.term.active{background:#e7f2e9;border-color:#c9dfce;color:#22613b;font-weight:700}.toast{position:fixed;z-index:20;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#193f2c;color:white;border-radius:11px;padding:12px 16px;font-size:13px;box-shadow:var(--shadow);pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{width:min(560px,calc(100% - 24px));max-height:90dvh;border:0;border-radius:18px;padding:20px;box-shadow:0 25px 80px #102f2280}dialog::backdrop{background:#10271d77}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.dialog-head h2{margin:0;font-size:18px}.dialog-body{display:grid;gap:12px}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.notice{padding:11px 13px;background:#f2f7f2;border-radius:10px;color:#48634e;font-size:12px;line-height:1.55}.notice.warn{background:#fff7e6;color:#80601f}.filebox{border:1.5px dashed #bbccbe;border-radius:14px;background:#f9fbf8;padding:22px;text-align:center}.filebox input{max-width:100%;margin-top:10px}.photo{max-width:100%;max-height:240px;object-fit:contain;border-radius:10px;margin-top:10px}.mobilebar{display:none}
    @media(max-width:950px){.side{width:215px}.main{margin-left:215px;padding-inline:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
    @media(max-width:700px){.side{display:none}.main{margin:0;padding:12px 13px calc(88px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:4;background:#f3f6f2ed;backdrop-filter:blur(8px);padding:7px 0 11px;margin:0 0 8px;min-height:62px}.top h1{font-size:21px}.headingline{font-size:11px}.top-actions .mock-badge{display:none}.top-actions .iconbtn{min-height:42px}.stats{gap:9px;margin:10px 0 12px}.stat{padding:13px;min-height:111px;border-radius:13px}.stat-value{font-size:20px}.stat-top{font-size:11px;align-items:flex-start}.stat-icon{width:29px;height:29px;font-size:15px}.stat-note{font-size:10px}.panel{padding:14px;margin-bottom:10px;border-radius:13px}.hero{padding:17px;align-items:flex-start;flex-direction:column;gap:13px}.hero h2{font-size:19px}.hero .btn{width:100%}.panel-head{align-items:flex-start}.panel h2,.panel h3{font-size:15px}.hint{font-size:11px}.filters{display:grid;grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}.filters input,.filters select{min-width:0;width:100%}.formrow{grid-template-columns:1fr 1fr}.table-scroll{margin-inline:-5px;padding-inline:5px}table{min-width:660px}.summaryline{gap:9px 15px}.actions{width:100%}.actions .btn{flex:1}.mobilebar{position:fixed;inset:auto 0 0;z-index:10;display:flex;justify-content:space-around;gap:2px;padding:5px 4px calc(5px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 18px #193a2510}.mobilebar button{flex:1;min-width:0;min-height:55px;border:0;background:transparent;border-radius:10px;color:#617168;display:grid;place-items:center;align-content:center;gap:1px;font-size:18px}.mobilebar button small{font-size:10px;white-space:nowrap}.mobilebar button.active{background:#e7f2e9;color:#17633e}.mobilebar .scanfab{color:#fff;background:var(--green);margin-top:-17px;height:62px;box-shadow:0 3px 12px #164c2b40}.mobilebar .scanfab small{color:white}dialog{border-radius:18px 18px 0 0;margin:auto 0 0;padding:18px 15px calc(18p     @media(max-width:370px){.main{padding-inline:9px}.stats{gap:7px}.stat{padding:10px}.stat-value{font-size:18px}.top h1{font-size:19px}.mobilebar button small{font-size:9px}}

<body>
  <div class="shell">
    <aside class="side" aria-label="मुख्य नेव्हिगेशन">
      <div class="brand"><div class="brandmark">✦</div><div><b>DairyAI</b><small>डेअरी व्यवस्थापन</small></div></div>
      <nav class="navset" id="desktopNav"></nav>
      <div class="sidebar-note">प्रोटोटाइप · नमुना माहिती<br>कोणताही खरा व्यवहार जतन होत नाही</div>
    </aside>
    <main class="main">
      <header class="top">
        <div><div class="headingline"><span id="dairyName">सह्याद्री दूध संकलन</span><span>·</span><span id="today"></span><span>·</span><span>सध्याची टर्म १–१० नोव्हेंबर</span></div><h1 id="pageTitle">मुख्यपृष्ठ</h1></div>
        <div class="top-actions"><span class="mock-badge">● फक्त नमुना माहिती</span><button class="iconbtn" id="languageToggle" aria-label="भाषा बदला">English</button><button class="iconbtn" data-action="profile" aria-label="प्रोफाइल">◉</button></div>
      </header>
      <div class="wrap" id="view"></div>
    </main>
    <nav class="mobilebar" id="mobileNav" aria-label="मोबाइल नेव्हिगेशन"></nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"><div id="dialogContent"></div></dialog>
  <script>
    (() => {
      const navItems = [
        ["home","⌂","मुख्यपृष्ठ","Home"],["milk","◉","दूध नोंद","Milk"],
        ["scan","▧","AI स्कॅन","Scan"],["feed","▤","पशुखाद्य","Feed"],
        ["farmers","♙","ग्राहक","Farmers"],["billing","₹","हिशोब","Billing"],
        ["rates","⌁","दूध दर पत्रक","Rate chart"],["transactions","↔","व्यवहार / अॅडव्हान्स","Transactions"],
        ["reports","▥","व्यवसाय अहवाल","Reports"],["settings","⚙","डेअरी सेटिंग्ज","Settings"],
        ["assistant","◌","मराठी सहाय्यक","Assistant"]
      ];
      const state = {
        page:"home", lang:"mr", feedTab:"stock", term:"१–१० नोव्हेंबर",
        milkRows:[
          {code:"D-024",name:"सुशीला पाटील",session:"सकाळ",litres:18.4,fat:4.2,snf:8.6,rate:38.4,amount:706.56,status:"मंजूर"},
          {code:"D-031",name:"रामदास शिंदे",session:"सकाळ",litres:14.2,fat:3.8,snf:8.4,rate:35.8,amount:508.36,status:"तपासा"},
          {code:"D-008",name:"लक्ष्मी जाधव",session:"सकाळ",litres:21.6,fat:4.5,snf:8.8,rate:41.2,amount:889.92,status:"मंजूर"},
          {code:"D-017",name:"विठ्ठल कदम",session:"संध्याकाळ",litres:16.1,fat:3.4,snf:8.1,rate:32.6,amount:524.86,status:"तपासा"},
          {code:"D-042",name:"मंगल मोरे",session:"सकाळ",litres:12.8,fat:4.1,snf:8.5,rate:37.7,amount:482.56,status:"मंजूर"}
        ],
        products:[
          {name:"शक्ती पशुखाद्य",code:"FD-01",qty:24,unit:"पोती",buy:1180,sell:1320,threshold:8},
          {name:"कॅल्शियम पावडर",code:"FD-02",qty:18,unit:"किलो",buy:42,sell:55,threshold:10},
          {name:"खनिज मिश्रण",code:"FD-03",qty:6,unit:"किलो",buy:160,sell:195,threshold:8},
          {name:"कडबा पूरक",code:"FD-04",qty:32,unit:"पोती",buy:940,sell:1080,threshold:10}
        ],
        farmers:[
          {code:"D-008",name:"लक्ष्मी जाधव",balance:3240,litres:184.6,advance:1000},
          {code:"D-024",name:"सुशीला पाटील",balance:2860,litres:161.2,advance:0},
          {code:"D-031",name:"रामदास शिंदे",balance:1480,litres:139.4,advance:2500},
          {code:"D-017",name:"विठ्ठल कदम",balance:920,litres:128.8,advance:0},
          {code:"D-042",name:"मंगल मोरे",balance:4180,litres:197.3,advance:500}
        ],
        billsGenerated:false,
        rates:{fats:["3.0","3.5","4.0","4.5","5.0"],snfs:["8.0","8.5","9.0"],values:[[27.4,29.8,32.2],[30.1,32.5,34.9],[32.8,35.2,37.6],[35.5,37.9,40.3],[38.2,40.6,43.0]]}
      };
      const tr = (mr,en) => state.lang==="mr" ? mr : en;
      const esc = value => String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      const money = n => new Intl.NumberFormat(state.lang==="mr"?"mr-IN":"en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(Number(n||0));
      const num = n => new Intl.NumberFormat(state.lang==="mr"?"mr-IN":"en-IN",{maximumFractionDigits:1}).format(Number(n||0));
      const navLabel = item => state.lang==="mr"?item[2]:item[3];
      const active = page => state.page===page?" active":"";
      const title = () => navLabel(navItems.find(item=>item[0]===state.page)||navItems[0]);
      const toast = message => {const node=document.querySelector("#toast");node.textContent=message;node.classList.add("show");setTimeout(()=>node.classList.remove("show"),2400)};
      const status = text => {
        const label=state.lang==="en"?({"तपासा":"Needs review","मंजूर":"Approved","चुकीची":"Invalid","उपलब्ध":"In stock"}[text]||text):text;
        return `<span class="status ${text==="तपासा"||text==="Needs review"?"review":text==="चुकीची"||text==="Invalid"?"invalid":""}">${esc(label)}</span>`;
      };
      const table = (heads,rows,extra="") => `<div class="table-scroll"><table ${extra}><thead><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
      const navButton = item => `<button class="nav${active(item[0])}" data-nav="${item[0]}"><span class="ico">${item[1]}</span><span>${navLabel(item)}</span></button>`;
      const renderNav = () => {
        const main = navItems.slice(0,6), more=navItems.slice(6);
        document.querySelector("#desktopNav").innerHTML=main.map(navButton).join("")+
          `<button class="nav more${more.some(item=>item[0]===state.page)?" active":""}" data-action="more"><span class="ico">···</span><span>${tr("अधिक","More")}</span></button>`+
          `<div class="more-links">${more.map(item=>`<button class="more-link${active(item[0])}" data-nav="${item[0]}">${navLabel(item)}</button>`).join("")}</div>`;
        document.querySelector("#mobileNav").innerHTML=[
          ["home","⌂",tr("होम","Home")],["milk","◉",tr("दूध","Milk")],["scan","▧",tr("स्कॅन","Scan")],
          ["feed","▤",tr("खाद्य","Feed")],["billing","₹",tr("हिशोब","Bill")]
        ].map(([page,icon,label])=>`<button data-nav="${page}" class="${page==="scan"?"scanfab":""}${active(page)}"><span>${icon}</span><small>${label}</small></button>`).join("");
      };
      const stat = (label,value,note,icon,page) => `<button class="card stat stat-link" data-nav="${page}"><span class="stat-top">${label}<span class="stat-icon">${icon}</span></span><span class="stat-value">${value}</span><span class="stat-note">${note}</span></button>`;
      const home = () => {
        const reviewed=state.milkRows.filter(row=>row.status==="तपासा").length;
        return `<div class="hero"><div><h2>${tr("आजची डेअरी स्थिती","Your dairy at a glance")}</h2><p>${tr("नोंदी तपासा आणि आजचा हिशोब एका ठिकाणी पाहा.","Review entries and keep today's work moving.")}</p></div><button class="btn" data-nav="scan">▧ &nbsp;${tr("AI स्कॅन करा","Scan a register")}</button></div>
          <div class="grid stats">${stat(tr("आजचे दूध","Today's milk"),"342.8 L",tr("कालपेक्षा १८ लिटर जास्त","18 L more than yesterday"),"◉","milk")}${stat(tr("आजचा दूध खर्च","Today's milk cost"),money(13860),tr("आज मंजूर झालेल्या नोंदी","Based on approved entries"),"₹","milk")}${stat(tr("या टर्मचे दूध","Milk this term"),"2,486 L",tr("१–१० नोव्हेंबर","1–10 November"),"▤","billing")}${stat(tr("या टर्मची रक्कम","Term amount"),money(98420),tr("बिल पाहण्यासाठी टॅप करा","Tap to open billing"),"₹","billing")}</div>
          <div class="grid split"><section class="panel"><div class="panel-head"><div><h2>${tr("आज लक्ष द्या","Needs your attention")}</h2><div class="hint">${tr("महत्त्वाची कामे प्राधान्याने दाखवली आहेत","Key actions for today")}</div></div></div><div class="alerts">
            <button class="alert amber" data-nav="milk"><span>◷ &nbsp;${tr("दूध नोंदी तपासायच्या","Milk entries to review")}</span><span class="count">${num(reviewed)}</span></button>
            <button class="alert amber" data-nav="scan"><span>▧ &nbsp;${tr("रजिस्टर तपासणी बाकी","Register scans pending")}</span><span class="count">2</span></button>

      const assistant = () => `<section class="panel"><div class="hero"><div><h2>${tr("डेअरीचा हिशोब विचारा","Ask about your dairy")}</h2><p>${tr("मराठीत बोला किंवा प्रश्न लिहा","Speak or type in Marathi")}</p></div><button class="btn" data-action="voice">🎙 &nbsp;${tr("बोलून विचारा","Ask by voice")}</button></div><div class="field"><label>${tr("तुमचा प्रश्न","Your question")}</label><input id="assistantQuestion" placeholder="${tr("उदा. रामदास यांची बाकी किती?","e.g. What is Ramdas's balance?")}"></div><div class="actions" style="margin-top:12px"><button class="btn primary" data-action="ask">${tr("विचारा","Ask")}</button><button class="btn" data-action="sample-question">${tr("नमुना प्रश्न","Sample question")}</button></div><div id="assistantAnswer"></div><div class="notice" style="margin-top:14px">${tr("नमुना सहाय्यक · फक्त वाचण्याची परवानगी","Sample assistant · read-only")}</div></section>`;
      const farmersDetail = i => {const f=state.farmers[i];return `<section class="panel"><div class="panel-head"><div><button class="btn small" data-nav="farmers">← ${tr("ग्राहक","Farmers")}</button><h2 style="margin-top:10px">${esc(f.name)} <span class="hint">${esc(f.code)}</span></h2></div><button class="btn">${tr("बदला","Edit")}</button></div><div class="grid stats">${stat(tr("सध्याची बाकी","Balance"),money(f.balance),tr("नमुना शिल्लक","Sample balance"),"₹","farmers")}${stat(tr("या टर्मचे दूध","Term milk"),`${num(f.litres)} L`,tr("सर्व नोंदी","All entries"),"◉","milk")}${stat(tr("अॅडव्हान्स बाकी","Advance outstanding"),money(f.advance),tr("अॅडव्हान्स","Advance"),"−","transactions")}${stat(tr("या टर्मचे बिल","Term bill"),money(f.balance),tr("मसुदा","Draft"),"▤","billing")}</div><div class="segment"><button class="active">दूध</button><button>पशुखाद्य</button><button>अॅडव्हान्स</button><button>बिले</button><button>अनामत</button></div><div class="hint">${tr("ग्राहक खाते तपशीलाचा नमुना","Sample farmer account detail")}</div></section>`};
      const viewForPage = () => {
        if(state.page==="home")return home();
        if(state.page==="milk")return milk();
        if(state.page==="scan")return scan();
        if(state.page==="feed")return feed();
        if(state.page==="farmers")return state.farmerIndex===undefined?farmers():farmersDetail(state.farmerIndex);
        if(state.page==="billing")return billing();
        if(state.page==="rates")return rates();
        if(state.page==="transactions")return transactions();
        if(state.page==="reports")return reports();
        if(state.page==="settings")return settings();
        return assistant();
      };
      const render = () => {
        renderNav();document.querySelector("#pageTitle").textContent=title();
        document.querySelector("#today").textContent=new Intl.DateTimeFormat(state.lang==="mr"?"mr-IN":"en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"}).format(new Date());
        document.querySelector("#dairyName").textContent=tr("सह्याद्री दूध संकलन","Sahyadri Milk Collection");
        document.querySelector("#languageToggle").textContent=state.lang==="mr"?"English":"मराठी";
        document.querySelector("#view").innerHTML=viewForPage();
      };
      const openDialog = (heading,content) => {
        document.querySelector("#dialogContent").innerHTML=`<div class="dialog-head"><h2>${heading}</h2><button class="iconbtn" data-action="close-dialog" aria-label="बंद करा">✕</button></div><div class="dialog-body">${content}</div>`;
        document.querySelector("#dialogContent").insertAdjacentHTML("beforeend",`<div class="dialog-foot"><button class="btn" data-action="close-dialog">${tr("रद्द करा","Cancel")}</button><button class="btn primary" data-action="dialog-save">${tr("नमुना जतन करा","Save demo")}</button></div>`);
        document.querySelector("#dialog").showModal();
      };
      const showScan = () => {
        document.querySelector("#scanOutput").innerHTML=`<div class="panel" style="padding:14px;margin:0"><div class="panel-head"><div><h3>${tr("ओळखलेला प्रकार: दूध नोंद","Detected: Milk register")}</h3><div class="hint">${tr("खात्री करा; हा फक्त नमुना निकाल आहे","Confirm the type · sample result only")}</div></div>${status("तपासा")}</div><div class="chips"><button class="chip active" data-action="scan-type" data-type="milk">${tr("दूध","Milk")}</button><button class="chip" data-action="scan-type" data-type="feed">${tr("पशुखाद्य विक्री","Feed sales")}</button><button class="chip" data-action="scan-type" data-type="rates">${tr("दरपत्रक","Rate chart")}</button></div><div class="summaryline" style="margin:10px 0"><span>${tr("एकूण नोंदी","Entries")} <b>5</b></span><span>${tr("तपासा","Review")} <b>2</b></span><span>${tr("चुकीची","Invalid")} <b>1</b></span></div>${table([tr("शेतकरी","Farmer"),tr("लिटर","Litres"),tr("FAT","FAT"),tr("SNF","SNF"),tr("स्थिती","Status")],`<tr><td>सुशीला पाटील</td><td>18.4</td><td>4.2</td><td>8.6</td><td>${status("मंजूर")}</td></tr><tr><td>रामदास शिंदे</td><td><input class="ratecell" value="14.2" aria-label="लिटर"></td><td><input class="ratecell" value="3.8"></td><td><input class="ratecell" placeholder="—"></td><td>${status("तपासा")}</td></tr>`) }<details style="margin-top:11px"><summary class="hint">${tr("मूळ फोटो पाहा","View original photo")}</summary><div class="notice">${tr("नमुना फोटो उपलब्ध नाही.","No sample photo attached.")}</div></details><div class="actions" style="margin-top:12px"><button class="btn" data-action="scan-add-row">${tr("＋ ओळ जोडा","＋ Add row")}</button><button class="btn primary" data-action="scan-approve">${tr("तपासलेल्या नोंदी मंजूर करा","Approve reviewed entries")}</button></div></div>`;
      };
      document.addEventListener("click",event=>{
        const nav=event.target.closest("[data-nav]");if(nav){state.page=nav.dataset.nav;delete state.farmerIndex;render();return}
        const button=event.target.closest("[data-action]");if(!button)return;
        const action=button.dataset.action;
        if(action==="more"){toast(tr("अधिक पर्याय खाली दिले आहेत","More destinations are listed below"));return}
        if(action==="feed-tab"){state.feedTab=button.dataset.tab;render();return}
        if(action==="term"){document.querySelectorAll(".term").forEach(node=>node.classList.remove("active"));button.classList.add("active");state.term=button.dataset.term;toast(tr("टर्म बदलली","Billing term changed"));return}
        if(action==="edit-milk"){openDialog(tr("दूध नोंद तपासा","Review milk entry"),`<div class="formrow"><div class="field"><label>${tr("शेतकरी","Farmer")}</label><input value="${esc(state.milkRows[button.dataset.index].name)}"></div><div class="field"><label>${tr("लिटर","Litres")}</label><input type="number" value="${state.milkRows[button.dataset.index].litres}"></div><div class="field"><label>FAT / SNF</label><input value="${state.milkRows[button.dataset.index].fat} / ${state.milkRows[button.dataset.index].snf}"></div></div><div class="notice">${tr("दर आणि रक्कम बॅकएंड मोजतो; या डेमोमध्ये बदल तात्पुरते आहेत.","The backend calculates rate and amount; demo edits are temporary.")}</div>`);return}
        if(action==="add-milk"){openDialog(tr("दूध नोंद जोडा","Add milk entry"),`<div class="formrow"><div class="field"><label>${tr("शेतकरी","Farmer")}</label><select>${state.farmers.map(f=>`<option>${esc(f.name)}</option>`).join("")}</select></div><div class="field"><label>${tr("लिटर","Litres")}</label><input type="number" placeholder="0.0"></div><div class="field"><label>${tr("वेळ","Session")}</label><select><option>${tr("सकाळ","Morning")}</option><option>${tr("संध्याकाळ","Evening")}</option></select></div></div>`);return}
        if(action==="farmer"){state.farmerIndex=Number(button.dataset.index);render();return}
        if(action==="add-farmer"){openDialog(tr("नवीन ग्राहक","Add farmer"),`<div class="formrow"><div class="field"><label>${tr("ग्राहक कोड","Farmer code")}</label><input placeholder="D-125"></div><div class="field"><label>${tr("नाव","Name")}</label><input placeholder="${tr("पूर्ण नाव","Full name")}"></div><div class="field"><label>${tr("मोबाइल","Phone")}</label><input type="tel"></div></div>`);return}
        if(action==="demo-scan"){showScan();return}
        if(action==="scan-type"){document.querySelectorAll(".chip").forEach(node=>node.classList.toggle("active",node===button));toast(tr("प्रकार निवडला: फक्त डेमो","Type selected · demo only"));return}
        if(action==="scan-approve"){toast(tr("नमुना नोंदी मंजूर · काहीही जतन केले नाही","Sample review complete · nothing was saved"));return}
        if(action==="scan-add-row"){toast(tr("नमुना ओळ जोडली","Sample row added"));return}
        if(action==="stock-in"){state.feedTab="inward";render();return}
        if(action==="add-inward-row"){toast(tr("Prototype: multi-row stock entry layout can be reviewed","Prototype: multi-row stock entry"));return}
        if(action==="save-inward"){toast(tr("नमुना साठा नोंद · कायम जतन नाही","Demo stock recorded · not persisted"));return}
        if(action==="edit-product"){openDialog(tr("उत्पादन तपशील","Product details"),`<div class="notice">${esc(button.dataset.code)} · ${tr("या नमुन्यातील संपादन तात्पुरते आहे.","Edits are temporary in this prototype.")}</div><div class="field"><label>${tr("विक्री दर","Selling price")}</label><input type="number" value="1320"></div>`);return}
        if(action==="feed-sale"){openDialog(tr("पशुखाद्य विक्री","Feed sale"),`<div class="field"><label>${tr("शेतकरी","Farmer")}</label><select>${state.farmers.map(f=>`<option>${esc(f.name)}</option>`).join("")}</select></div><div class="formrow"><div class="field"><label>${tr("उत्पादन","Product")}</label><select>${state.products.map(p=>`<option>${esc(p.name)}</option>`).join("")}</select></div><div class="field"><label>${tr("प्रमाण","Quantity")}</label><input type="number" value="1"></div><div class="field"><label>${tr("दिनांक","Date")}</label><input type="date" value="2026-11-06"></div></div>`);return}
        if(action==="generate-bills"){state.billsGenerated=true;render();toast(tr("मसुदा बिलं तयार · नमुना माहिती","Drafts generated · mock data"));return}
        if(action==="bill-preview"){openDialog(tr("नमुना बिल","Sample bill"),`<div class="profile"><div class="avatar">सु</div><div><b>सुशीला पाटील</b><small>D-024 · ${state.term}</small></div></div><div class="summaryline"><span>${tr("दूध जमा","Milk earnings")} <b>${money(6840)}</b></span><span>${tr("खाद्य कपात","Feed")} <b>− ${money(1320)}</b></span><span>${tr("देय","Payable")} <b>${money(5520)}</b></span></div><div class="notice">${tr("फक्त नमुना बिल · अंतिम किंवा छापता येणारे बिल नाही","Sample only · not a finalized or printable bill")}</div>`);return}
        if(action==="advance"){openDialog(tr("अॅडव्हान्स द्या","Give an advance"),`<div class="formrow"><div class="field"><label>${tr("शेतकरी","Farmer")}</label><select>${state.farmers.map(f=>`<option>${esc(f.name)}</option>`).join("")}</select></div><div class="field"><label>${tr("रक्कम","Amount")}</label><input type="number" placeholder="₹"></div><div class="field"><label>${tr("दिनांक","Date")}</label><input type="date" value="2026-11-06"></div></div><div class="field"><label>${tr("प्रति टर्म परतफेड","Repayment per term")}</label><input type="number"></div>`);return}
        if(action==="dispatch"||action==="expense"){openDialog(action==="dispatch"?tr("दूध विक्री नोंद","Record milk dispatch"):tr("व्यवसाय खर्च","Operating expense"),`<div class="formrow"><div class="field"><label>${tr("रक्कम","Amount")}</label><input type="number"></div><div class="field"><label>${tr("दिनांक","Date")}</label><input type="date" value="2026-11-06"></div><div class="field"><label>${tr("तपशील","Description")}</label><input></div></div>`);return}
        if(action==="save-rates"){toast(tr("नवीन दरपत्रक आवृत्ती तयार · नमुना बदल","New chart version previewed · sample only"));return}
        if(action==="ask"){const q=document.querySelector("#assistantQuestion").value;document.querySelector("#assistantAnswer").innerHTML=`<div class="notice" style="margin-top:12px">${q?tr("नमुना उत्तर: या टर्मची एकूण बाकी दाखवण्यासाठी हिशोब पान उघडा.","Sample answer: open Billing to review current term totals."):""} </div>`;return}
        if(action==="sample-question"){document.querySelector("#assistantQuestion").value=tr("या टर्मची एकूण बाकी किती?","What is the total balance this term?");return}
        if(action==="voice"){toast(tr("आवाज सुविधा या नमुन्यात जोडलेली नाही","Voice input is not connected in this prototype"));return}
        if(action==="profile"){state.page="settings";render();return}
        if(action==="close-dialog"){document.querySelector("#dialog").close();return}
        if(action==="dialog-save"){document.querySelector("#dialog").close();toast(tr("डेमो बदल दाखवले · डेटाबेसमध्ये जतन नाही","Demo only · nothing saved to a database"));return}
      });
      document.querySelector("#languageToggle").addEventListener("click",()=>{state.lang=state.lang==="mr"?"en":"mr";render()});
      document.querySelector("#view").addEventListener("change",event=>{
        if(event.target.id==="scanFile"&&event.target.files?.[0]){const image=document.querySelector("#photoPreview");image.src=URL.createObjectURL(event.target.files[0]);image.hidden=false;toast(tr("फोटो फक्त तुमच्या ब्राउजरमध्ये दिसतो","Photo stays in this browser"))}
        if(event.target.matches(".ratecell")){const r=Number(event.target.dataset.ri),c=Number(event.target.dataset.ci);state.rates.values[r][c]=Number(event.target.value)||0}
      });
      render();
    })();
  </script>
</body>
</html>
